name: skill-radar

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${PGDATABASE:?set PGDATABASE in .env}
      POSTGRES_USER: ${PGUSER:?set PGUSER in .env}
      POSTGRES_PASSWORD: ${PGPASSWORD:?set PGPASSWORD in .env}
    ports:
      - "127.0.0.1:${PGPORT:-5432}:5432" # only reachable from this machine
    volumes:
      # Postgres 18+ images keep data in /var/lib/postgresql/18/docker, so mount the
      # parent folder. (Postgres 17 and older used /var/lib/postgresql/data.)
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
